# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9 uses built-in Kotlin; allow KSP to register its generated Kotlin source sets.
android.disallowKotlinSourceSets=false
# compileSdk 37.1 is newer than this AGP officially recognizes; the APIs are present.
android.suppressUnsupportedCompileSdk=37.1
