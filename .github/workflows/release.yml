name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Secrets can pick up a trailing newline from copy/paste; $(...) strips it.
          STORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD")"
          ALIAS="$(printf '%s' "$KEY_ALIAS")"
          KEY_PW="$(printf '%s' "$KEY_PASSWORD")"
          cat > keystore.properties <<EOF
          storeFile=${{ runner.temp }}/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PW
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEST="app/build/outputs/apk/release/Regimen-${VERSION}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
